services:
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    # Bỏ comment nếu có GPU NVIDIA:
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["./vector-db:/qdrant/storage"]

  searxng:
    image: searxng/searxng
    ports: ["8080:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml"]

  openwebui:
    image: ghcr.io/open-webui/open-webui
    ports: ["3000:8080"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [ollama]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      KNOWLEDGE_DIR: /app/knowledge
      CATALOGUES_DIR: /app/catalogues
    volumes:
      - ./knowledge:/app/knowledge
      - ./catalogues:/app/catalogues
    depends_on: [ollama, qdrant, searxng]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3001:3000"]
    depends_on: [backend]

volumes:
  ollama:
