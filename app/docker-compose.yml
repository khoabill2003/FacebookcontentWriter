services:
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["./vector-db:/qdrant/storage"]
  searxng:
    image: searxng/searxng
    ports: ["8080:8080"]
  openwebui:
    image: ghcr.io/open-webui/open-webui
    ports: ["3000:8080"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      SEARXNG_URL: http://searxng:8080
    depends_on: [ollama, qdrant, searxng]
volumes:
  ollama:
